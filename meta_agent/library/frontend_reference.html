<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课程内容营销工作流</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-hover: #4338ca;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --warn: #d97706;
      --warn-bg: #fffbeb;
      --surface: #ffffff;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.07);
      --sidebar-w: 260px;
      --output-w: 320px;
    }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top Bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .topbar-logo {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.4px;
    }
    .topbar-logo span { color: var(--text); }
    .topbar-divider { width: 1px; height: 24px; background: var(--border); }
    .topbar-subtitle { font-size: 13px; color: var(--text-muted); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .topbar-progress-label { font-size: 13px; color: var(--text-muted); }
    .topbar-progress-bar {
      width: 140px; height: 6px; background: var(--border); border-radius: 4px; overflow: hidden;
    }
    .topbar-progress-fill {
      height: 100%; background: linear-gradient(90deg,var(--primary),#818cf8); border-radius: 4px;
      transition: width .5s ease;
    }
    .topbar-pct { font-size: 13px; font-weight: 600; color: var(--primary); min-width: 36px; text-align: right; }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Steps Sidebar ── */
    .steps-sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .steps-sidebar-header {
      padding: 16px 20px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .steps-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }
    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background .15s;
      border-left: 3px solid transparent;
    }
    .step-item:hover { background: #f8fafc; }
    .step-item.active { background: var(--primary-light); border-left-color: var(--primary); }
    .step-item.completed { opacity: .85; }
    .step-number {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; margin-top: 1px;
      background: var(--border); color: var(--text-muted);
      transition: background .2s, color .2s;
    }
    .step-item.active .step-number { background: var(--primary); color: #fff; }
    .step-item.completed .step-number { background: var(--success); color: #fff; }
    .step-item.running .step-number { background: #f59e0b; color: #fff; animation:pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
    .step-info { flex: 1; min-width: 0; }
    .step-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step-item.active .step-name { color: var(--primary); }
    .step-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .step-type-badge {
      font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 6px; white-space: nowrap;
      margin-top: 4px; display: inline-block;
    }
    .badge-user_input { background: #fef3c7; color: #92400e; }
    .badge-skill { background: #dbeafe; color: #1d4ed8; }
    .badge-user_file_input { background: #d1fae5; color: #065f46; }

    /* ── Main Panel ── */
    .main-panel {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Output Panel ── */
    .output-panel {
      width: var(--output-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .output-panel-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .output-panel-header h3 { font-size: 14px; font-weight: 700; color: var(--text); }
    .output-panel-sub { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .output-list {
      overflow-y: auto;
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .output-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .output-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .output-card-header .oc-step { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 2px 8px; border-radius: 10px; }
    .output-card-header .oc-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .output-card-header .oc-status { margin-left: auto; font-size: 11px; }
    .oc-status.done { color: var(--success); }
    .oc-status.running { color: var(--warn); }
    .oc-status.pending { color: var(--text-light); }
    .output-card-body { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .output-card-body pre { font-size: 11px; background: var(--bg); padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto; margin-top: 6px; }
    .output-empty { font-size: 13px; color: var(--text-light); text-align: center; padding: 24px; line-height: 1.6; }

    /* ── Node Cards ── */
    .node-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 28px 28px 24px;
      max-width: 680px;
      width: 100%;
    }
    .node-card-hidden { display: none; }

    .node-badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .node-badge {
      font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
      letter-spacing: .3px;
    }
    .nb-user_input { background: #fef3c7; color: #92400e; }
    .nb-skill { background: #dbeafe; color: #1d4ed8; }
    .nb-user_file_input { background: #d1fae5; color: #065f46; }
    .node-step-label { font-size: 12px; color: var(--text-muted); }

    .node-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .node-desc { font-size: 14px; color: var(--text-muted); line-height: 1.55; margin-bottom: 22px; }

    /* deps */
    .deps-section { margin-bottom: 22px; }
    .section-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
    .dep-list { display: flex; flex-direction: column; gap: 6px; }
    .dep-row {
      display: flex; align-items: center; gap: 10px;
      background: #f8fafc; border: 1px solid var(--border); border-radius: 9px; padding: 9px 14px;
    }
    .dep-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
    .dep-row-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .dep-row-status { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--success); }

    /* form elements */
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .form-label .req { color: #ef4444; margin-left: 2px; }
    .form-hint { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    textarea, select, input[type="text"] {
      width: 100%; padding: 10px 14px; font-size: 14px; font-family: inherit;
      border: 1px solid #d1d5db; border-radius: 10px; background: #fafafa;
      transition: border-color .2s, box-shadow .2s; resize: vertical;
    }
    textarea:focus, select:focus, input[type="text"]:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.12); background: #fff;
    }
    textarea { min-height: 90px; }
    textarea.large { min-height: 130px; }

    /* keyword tags */
    .keyword-tags { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 10px; }
    .keyword-tag {
      display: inline-flex; align-items: center; gap: 5px; background: #f0f3f8;
      border: 1px solid #dce0e8; border-radius: 24px; padding: 7px 14px; font-size: 13px;
      color: var(--text); cursor: pointer; transition: all .15s; user-select: none;
    }
    .keyword-tag:hover { border-color: var(--primary); background: var(--primary-light); }
    .keyword-tag.selected { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* reference cards */
    .ref-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .ref-card {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .ref-card:hover { border-color: var(--primary); background: var(--primary-light); }
    .ref-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .ref-card .ref-check { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #d1d5db; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent; background:#fff; transition:.15s; }
    .ref-card.selected .ref-check { background: var(--primary); border-color: var(--primary); color: #fff; }
    .ref-card .ref-info { flex: 1; min-width: 0; }
    .ref-card .ref-title { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ref-card .ref-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .ref-card .ref-tag { font-size: 11px; background: #eef2ff; color: var(--primary); padding: 2px 8px; border-radius: 10px; flex-shrink:0; }

    /* upload area */
    .upload-area {
      border: 2px dashed #d1d5db; border-radius: 12px; padding: 36px 20px;
      text-align: center; cursor: pointer; transition: border-color .2s, background .2s;
      background: #fafbfc; margin-bottom: 16px; position: relative;
    }
    .upload-area:hover, .upload-area.dragover { border-color: var(--primary); background: var(--primary-light); }
    .upload-area.has-files { border-color: var(--success); background: var(--success-bg); }
    .upload-icon { font-size: 36px; margin-bottom: 10px; }
    .upload-text { font-size: 14px; color: var(--text); margin-bottom: 5px; }
    .upload-hint { font-size: 12px; color: var(--text-light); }
    .upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .file-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .file-item {
      display: flex; align-items: center; gap: 10px; background: #f9fafb;
      border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    }
    .file-item .fi-icon { font-size: 18px; flex-shrink: 0; }
    .file-item .fi-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .file-item .fi-size { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
    .file-item .fi-remove { background:none; border:none; color:#ef4444; cursor:pointer; font-size:16px; padding:0 2px; flex-shrink:0; }

    /* skill node */
    .info-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .info-chip { background: #f1f5f9; border-radius: 8px; padding: 8px 14px; font-size: 13px; color: #334155; display: flex; align-items: center; gap: 6px; }
    .info-chip strong { font-weight: 600; color: var(--text); }

    .progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg,var(--primary),#818cf8); border-radius: 4px; transition: width .4s ease; }
    .progress-status { font-size: 13px; color: var(--text-muted); text-align: center; min-height: 20px; }
    .progress-status.running { color: var(--primary); }
    .progress-status.done { color: var(--success); }
    .progress-status.error { color: var(--error); }

    .output-preview { background: #f8fafc; border: 1px solid var(--border); border-radius: 11px; padding: 16px; margin-top: 12px; display: none; }
    .output-preview.visible { display: block; }
    .output-preview h4 { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .output-preview ul { list-style: none; }
    .output-preview li { font-size: 13px; color: #334155; padding: 5px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .output-preview li:last-child { border-bottom: none; }
    .output-tag { background: var(--primary-light); color: var(--primary); padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; }

    /* action area */
    .action-area { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 24px; border-radius: 10px; font-size: 14px; font-weight: 600;
      border: none; cursor: pointer; transition: background .15s, box-shadow .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 2px 8px rgba(79,70,229,.25); }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; box-shadow: none; transform: none; }
    .btn-secondary { background: #f1f5f9; color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
    .btn-secondary:disabled { opacity: .5; cursor: not-allowed; }

    .status-msg { font-size: 13px; padding: 10px 14px; border-radius: 9px; margin-top: 14px; display: none; }
    .status-msg.error { display: block; background: var(--error-bg); color: var(--error); border: 1px solid var(--error-border); }
    .status-msg.success { display: block; background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }

    /* completion screen */
    .completion-card { text-align: center; padding: 48px 28px; }
    .completion-icon { font-size: 64px; margin-bottom: 20px; }
    .completion-title { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .completion-sub { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }
    .completion-actions { display: flex; justify-content: center; gap: 12px; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    @media(max-width:900px) {
      .output-panel { display: none; }
      :root { --sidebar-w: 220px; }
    }
    @media(max-width:640px) {
      .steps-sidebar { display: none; }
      .main-panel { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-logo">Work<span>Gear</span></div>
  <div class="topbar-divider"></div>
  <div class="topbar-subtitle">课程内容营销工作流</div>
  <div class="topbar-right">
    <span class="topbar-progress-label">整体进度</span>
    <div class="topbar-progress-bar"><div class="topbar-progress-fill" id="globalProgressFill" style="width:0%"></div></div>
    <span class="topbar-pct" id="globalProgressPct">0%</span>
  </div>
</div>

<!-- Layout -->
<div class="layout">

  <!-- Steps Sidebar -->
  <nav class="steps-sidebar">
    <div class="steps-sidebar-header">工作流步骤</div>
    <div class="steps-list" id="stepsList"></div>
  </nav>

  <!-- Main Panel -->
  <main class="main-panel" id="mainPanel">
    <!-- Node cards injected here by JS -->
  </main>

  <!-- Output Panel -->
  <aside class="output-panel">
    <div class="output-panel-header">
      <h3>📋 步骤输出 (StepRunOutput)</h3>
      <span class="output-panel-sub" id="outputCount">0 / 10</span>
    </div>
    <div class="output-list" id="outputList">
      <div class="output-empty">各步骤执行完成后，输出结果将显示在此处。</div>
    </div>
  </aside>

</div>

<script>
(function() {
  // ── Workflow Definition ──
  const WORKFLOW = [
    {
      id: 'CourseInput', name: '课程内容输入', step: 1,
      type: 'user_input',
      desc: '输入课程内容文档、目标用户画像、教学大纲，并选择目标平台。',
      depends: [],
      inputs_format: { course_document:'string', target_profile:'string', teaching_outline:'string', platform:'string' }
    },
    {
      id: 'HotKeywordAnalysis', name: '热点关键词分析', step: 2,
      type: 'skill', skill_name: 'tikhub_scrawler',
      desc: '调用 TikHub API 获取热点关键词，分析课程核心价值，输出候选关键词列表。',
      depends: ['CourseInput']
    },
    {
      id: 'KeywordSelection', name: '关键词选择', step: 3,
      type: 'user_input',
      desc: '从候选关键词列表中选择最终用于内容创作的关键词（建议选 2~5 个）。',
      depends: ['HotKeywordAnalysis'],
      inputs_format: { selected_keywords: 'array' }
    },
    {
      id: 'TrendingContentSearch', name: '爆款内容搜索', step: 4,
      type: 'skill', skill_name: 'tikhub_scrawler',
      desc: '根据关键词调用 TikHub API 搜索爆款内容，输出爆款内容列表。',
      depends: ['KeywordSelection']
    },
    {
      id: 'UserReferenceUpload', name: '上传参考内容', step: 5,
      type: 'user_file_input',
      desc: '上传自有参考内容（图文 / 视频 / 数字人视频），作为脚本创作的参考素材。',
      depends: []
    },
    {
      id: 'ReferenceSelection', name: '参考内容选择', step: 6,
      type: 'user_input',
      desc: '从爆款内容列表选择参考内容，结合上传文件，确定最终参考集。',
      depends: ['TrendingContentSearch','UserReferenceUpload'],
      inputs_format: { selected_references: 'array' }
    },
    {
      id: 'ScriptGeneration', name: '脚本生成', step: 7,
      type: 'skill', skill_name: 'graphic_design',
      desc: '调用大语言模型和图片生成模型，基于参考内容仿写脚本候选。',
      depends: ['ReferenceSelection']
    },
    {
      id: 'ScriptEditing', name: '脚本编辑', step: 8,
      type: 'user_input',
      desc: '在生成的脚本基础上进行人工修改与确认，输出最终脚本。',
      depends: ['ScriptGeneration'],
      inputs_format: { edited_script: 'string' }
    },
    {
      id: 'MultimediaProduction', name: '多媒体制作', step: 9,
      type: 'skill', skill_name: 'graphic_design',
      desc: '根据内容形式调用 graphic_design / 数字人接口 / 视频生成接口，制作多媒体内容。',
      depends: ['ScriptEditing']
    },
    {
      id: 'DistributionPackageGeneration', name: '分发包生成', step: 10,
      type: 'skill', skill_name: 'graphic_design',
      desc: '调用大语言模型和生图模型，生成标题、封面、文案，打包完整分发物料。',
      depends: ['MultimediaProduction']
    }
  ];

  // ── State ──
  // status: 'pending' | 'active' | 'running' | 'completed'
  const state = {
    stepStatus: {},   // id -> status
    stepOutputs: {},  // id -> {label, data}
    currentStep: null
  };

  WORKFLOW.forEach(n => { state.stepStatus[n.id] = 'pending'; });

  // ── Helpers ──
  function completedCount() { return WORKFLOW.filter(n => state.stepStatus[n.id] === 'completed').length; }
  function canActivate(node) {
    return node.depends.every(d => state.stepStatus[d] === 'completed');
  }
  function nextPendingStep() {
    return WORKFLOW.find(n => state.stepStatus[n.id] === 'pending' && canActivate(n)) || null;
  }

  // ── Render Progress ──
  function updateProgress() {
    const done = completedCount();
    const pct = Math.round(done / WORKFLOW.length * 100);
    document.getElementById('globalProgressFill').style.width = pct + '%';
    document.getElementById('globalProgressPct').textContent = pct + '%';
    document.getElementById('outputCount').textContent = done + ' / ' + WORKFLOW.length;
  }

  // ── Render Steps Sidebar ──
  function renderSidebar() {
    const list = document.getElementById('stepsList');
    list.innerHTML = '';
    WORKFLOW.forEach(node => {
      const status = state.stepStatus[node.id];
      const item = document.createElement('div');
      item.className = 'step-item ' + (status === 'active' ? 'active' : status === 'completed' ? 'completed' : status === 'running' ? 'running' : '');
      item.dataset.id = node.id;
      item.innerHTML = `
        <div class="step-number">${status === 'completed' ? '✓' : status === 'running' ? '⏳' : node.step}</div>
        <div class="step-info">
          <div class="step-name">${node.name}</div>
          <div class="step-desc">${node.desc}</div>
          <span class="step-type-badge badge-${node.type}">${typeLabel(node.type)}</span>
        </div>`;
      item.addEventListener('click', () => {
        if (status !== 'pending' || state.currentStep === node.id) showStep(node.id);
      });
      list.appendChild(item);
    });
  }

  function typeLabel(t) {
    return { user_input:'用户输入', skill:'技能节点', user_file_input:'文件上传' }[t] || t;
  }

  // ── Render Output Panel ──
  function renderOutputPanel() {
    const list = document.getElementById('outputList');
    const entries = WORKFLOW.filter(n => state.stepOutputs[n.id]);
    if (entries.length === 0) {
      list.innerHTML = '<div class="output-empty">各步骤执行完成后，输出结果将显示在此处。</div>';
      return;
    }
    list.innerHTML = '';
    entries.slice().reverse().forEach(node => {
      const out = state.stepOutputs[node.id];
      const card = document.createElement('div');
      card.className = 'output-card';
      card.innerHTML = `
        <div class="output-card-header">
          <span class="oc-step">步骤 ${node.step}</span>
          <span class="oc-name">${node.name}</span>
          <span class="oc-status done">✓ 完成</span>
        </div>
        <div class="output-card-body">
          <div>${out.label}</div>
          <pre>${JSON.stringify(out.data, null, 2)}</pre>
        </div>`;
      list.appendChild(card);
    });
  }

  // ── Show Step ──
  function showStep(id) {
    state.currentStep = id;
    const node = WORKFLOW.find(n => n.id === id);
    document.querySelectorAll('.node-card').forEach(el => { el.classList.add('node-card-hidden'); });
    const card = document.getElementById('card-' + id);
    if (card) card.classList.remove('node-card-hidden');
    renderSidebar();
  }

  // ── Mark Complete & Advance ──
  function markComplete(id, outputData) {
    state.stepStatus[id] = 'completed';
    const node = WORKFLOW.find(n => n.id === id);
    state.stepOutputs[id] = outputData;
    updateProgress();
    renderOutputPanel();

    // Check if all done
    if (completedCount() === WORKFLOW.length) {
      showCompletion();
      return;
    }
    // activate next available
    const next = nextPendingStep();
    if (next) {
      state.stepStatus[next.id] = 'active';
      renderSidebar();
      showStep(next.id);
    } else {
      renderSidebar();
    }
  }

  function attachFileUploadLogic(node, div) {
    const area = div.querySelector('#ua-area');
    const fileInput = div.querySelector('#ua-input');
    const fileListEl = div.querySelector('#ua-file-list');
    const submitBtn = div.querySelector('#ua-submit');
    const clearBtn = div.querySelector('#ua-clear');
    const statusMsg = div.querySelector('#ua-status');
    const icon = div.querySelector('#ua-icon');
    let files = [];

    function renderFiles() {
      fileListEl.innerHTML = '';
      if (!files.length) { area.classList.remove('has-files'); icon.textContent = '📤'; submitBtn.disabled = true; clearBtn.disabled = true; return; }
      area.classList.add('has-files'); icon.textContent = '✅'; submitBtn.disabled = false; clearBtn.disabled = false;
      files.forEach((f,i) => {
        let ic = '📄';
        if (f.type.startsWith('image/')) ic='🖼️';
        else if (f.type.startsWith('video/')) ic='🎬';
        else if (f.type.includes('pdf')) ic='📕';
        const sz = f.size < 1024*1024 ? (f.size/1024).toFixed(1)+' KB' : (f.size/1024/1024).toFixed(1)+' MB';
        const item = document.createElement('div'); item.className = 'file-item';
        item.innerHTML = `<span class="fi-icon">${ic}</span><span class="fi-name" title="${f.name}">${f.name}</span><span class="fi-size">${sz}</span><button class="fi-remove" data-i="${i}">✕</button>`;
        fileListEl.appendChild(item);
      });
      fileListEl.querySelectorAll('.fi-remove').forEach(btn => btn.addEventListener('click', () => {
        files.splice(parseInt(btn.dataset.i), 1); renderFiles();
      }));
    }

    area.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { files = [...files, ...fileInput.files]; fileInput.value=''; renderFiles(); });
    area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
    area.addEventListener('dragleave', () => area.classList.remove('dragover'));
    area.addEventListener('drop', e => { e.preventDefault(); area.classList.remove('dragover'); files = [...files,...e.dataTransfer.files]; renderFiles(); });
    clearBtn.addEventListener('click', () => { files=[]; renderFiles(); });
    submitBtn.addEventListener('click', () => {
      statusMsg.textContent = '✅ ' + files.length + ' 个文件已上传！'; statusMsg.className = 'status-msg success';
      markComplete(node.id, { label:`已上传 ${files.length} 个文件`, data: { files: files.map(f=>f.name) } });
    });
    div.querySelector('#ua-skip').addEventListener('click', () => {
      markComplete(node.id, { label:'跳过文件上传', data: { files: [] } });
    });
  }

  function attachSkillLogic(node, div) {
    const runBtn = div.querySelector(`#skill-run-${node.id}`);
    const resetBtn = div.querySelector(`#skill-reset-${node.id}`);
    const pf = div.querySelector(`#pf-${node.id}`);
    const ps = div.querySelector(`#ps-${node.id}`);
    const op = div.querySelector(`#op-${node.id}`);
    const statusEl = div.querySelector(`#skill-status-${node.id}`);
    let interval = null, prog = 0, running = false;

    const messages = [
      ['正在初始化技能模块…','正在调用 API…','正在处理数据…','正在生成结果…'],
      ['正在连接服务…','正在检索内容…','正在分析匹配度…','正在排序输出…'],
    ];
    const msgs = messages[Math.floor(Math.random()*messages.length)];

    function reset() {
      clearInterval(interval); running = false; prog = 0;
      pf.style.width = '0%'; ps.textContent = '点击下方按钮开始执行'; ps.className = 'progress-status';
      statusEl.textContent = '等待执行'; statusEl.style.color = '';
      op.classList.remove('visible'); runBtn.disabled = false; runBtn.innerHTML = '▶ 开始执行'; resetBtn.disabled = true;
    }

    runBtn.addEventListener('click', () => {
      if (running) return;
      running = true; runBtn.disabled = true; runBtn.innerHTML = '⏳ 执行中…';
      resetBtn.disabled = false; op.classList.remove('visible');
      statusEl.textContent = '运行中'; statusEl.style.color = 'var(--primary)';
      ps.className = 'progress-status running'; prog = 0;
      interval = setInterval(() => {
        prog += prog < 85 ? Math.random()*14+4 : Math.random()*1.5+0.3;
        if (prog > 99) prog = 99;
        pf.style.width = Math.min(prog,100)+'%';
        ps.textContent = msgs[Math.floor(prog/25)] || msgs[msgs.length-1];
      }, 350);
      setTimeout(() => {
        clearInterval(interval); prog = 100; pf.style.width = '100%';
        ps.textContent = '✅ 执行完成！'; ps.className = 'progress-status done';
        statusEl.textContent = '已完成'; statusEl.style.color = 'var(--success)';
        op.classList.add('visible'); running = false;
        resetBtn.disabled = false; runBtn.innerHTML = '▶ 开始执行'; runBtn.disabled = true;
        // next button
        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn btn-primary'; nextBtn.textContent = '→ 进入下一步';
        nextBtn.addEventListener('click', () => {
          markComplete(node.id, { label:'技能节点执行完成', data: { status:'success', node: node.id } });
        });
        div.querySelector('.action-area').appendChild(nextBtn);
      }, 3000 + Math.random()*2000);
    });

    resetBtn.addEventListener('click', reset);
    reset();
  }

  // ── Init ──
  function init() {
    buildAllCards();

    // Find all initially available steps
    WORKFLOW.forEach(node => {
      if (canActivate(node)) state.stepStatus[node.id] = 'active';
    });

    const first = WORKFLOW.find(n => state.stepStatus[n.id] === 'active');
    if (first) {
      state.currentStep = first.id;
      showStep(first.id);
    }

    renderSidebar();
    updateProgress();
    renderOutputPanel();
  }

  init();
})();
</script>
</body>
</html>
